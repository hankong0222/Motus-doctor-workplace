<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motus Gym</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="gym-canvas" aria-label="Motus gym 3D scene"></canvas>
    <button id="bvh-visual-toggle" class="visual-toggle" type="button" aria-pressed="true">BVH On</button>
    <button id="body-axis-toggle" class="visual-toggle body-axis-toggle" type="button" aria-pressed="true">Body Axis On</button>
    <aside class="video-panel" aria-label="Reference video">
      <video id="reference-video" class="video-panel__media" autoplay muted loop playsinline preload="auto">
        <source src="/asset/reference-motion-h264.mp4" type="video/mp4" />
      </video>
    </aside>
    <div class="hud" aria-live="polite">
      <span class="hud__title">Motus Gym</span>
      <span class="hud__status" id="scene-status">Loading model</span>
    </div>
    <div class="debug-view-switch" role="tablist" aria-label="Debug views">
      <button id="debug-dashboard-tab" class="ik-debug-tab" type="button" aria-pressed="true">Dashboard</button>
      <button id="trajectory-sphere-tab" class="ik-debug-tab" type="button" aria-pressed="false">Trajectory</button>
    </div>
    <aside class="ik-debug-panel" aria-label="BVH IK and gait analysis debug">
      <div class="ik-debug-panel__header">
        <span class="ik-debug-panel__title">BVH IK / Gait</span>
        <span class="ik-debug-panel__status" id="ik-debug-status">Loading BVH</span>
      </div>
      <div id="debug-dashboard-view" class="ik-debug-view">
        <pre id="ik-debug-readout" class="ik-debug-readout">Waiting for BVH analysis</pre>
      </div>
      <div id="trajectory-sphere-view" class="ik-debug-view trajectory-sphere-view" hidden>
        <canvas id="trajectory-sphere-canvas" class="trajectory-sphere-canvas" aria-label="Pelvis forward axis trajectory sphere"></canvas>
        <div class="trajectory-sphere-meta">
          <span id="trajectory-sphere-title">Pelvis Axis Sphere</span>
          <span id="trajectory-sphere-frame">Waiting for BVH</span>
        </div>
        <div id="trajectory-sphere-vector" class="trajectory-sphere-vector">Z axis n/a</div>
        <div class="com-stability-card">
          <div class="com-stability-card__header">
            <span>eCOM Stability</span>
            <span id="com-stability-status">Waiting</span>
          </div>
          <canvas id="com-stability-canvas" class="com-stability-canvas" aria-label="COM stability and support polygon"></canvas>
          <div id="com-stability-readout" class="com-stability-readout">COM n/a</div>
        </div>
      </div>
      <div class="ik-debug-panel__actions">
        <button id="ik-export-json" class="ik-debug-button" type="button" disabled>JSON</button>
        <button id="ik-export-csv" class="ik-debug-button" type="button" disabled>CSV</button>
      </div>
    </aside>
    <section class="timeline-panel" aria-label="Playback timeline">
      <button id="play-toggle" class="timeline-button timeline-button--primary" type="button">Pause</button>
      <button id="step-back" class="timeline-button" type="button" aria-label="Previous frame">-1f</button>
      <button id="step-forward" class="timeline-button" type="button" aria-label="Next frame">+1f</button>
      <input
        id="timeline-scrubber"
        class="timeline-scrubber"
        type="range"
        min="0"
        max="1000"
        value="0"
        step="1"
        aria-label="Timeline"
      />
      <output id="timeline-time" class="timeline-time">00:00 / 00:00</output>
      <select id="speed-select" class="speed-select" aria-label="Playback speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
      </select>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
